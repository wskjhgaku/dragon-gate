<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dragon Gate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Hide scrollbar for a cleaner app look */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen">
    <!-- Main App Container -->
    <div id="app-container" class="max-w-md mx-auto h-screen sm:border-x sm:border-slate-800 shadow-2xl overflow-hidden relative flex flex-col items-center justify-center p-6">
        
        <!-- Toast Container -->
        <div id="toast-container" class="fixed top-4 left-1/2 transform -translate-x-1/2 z-[100] flex flex-col gap-2 pointer-events-none w-11/12 max-w-sm"></div>

        <!-- =================== -->
        <!--     Lobby View      -->
        <!-- =================== -->
        <div id="lobby-view" class="w-full flex flex-col items-center gap-6">
            <!-- App Title -->
            <h1 class="text-4xl font-bold text-yellow-400 mb-6 tracking-wider drop-shadow-lg">🐉 射龍門</h1>
            
            <!-- Create Room Section -->
            <div class="w-full bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700 flex flex-col gap-4 relative overflow-hidden">
                <div class="absolute -top-10 -right-10 w-24 h-24 bg-blue-500/10 rounded-full blur-xl"></div>
                
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-1">Player Name</label>
                    <input type="text" id="player-name" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all placeholder:text-slate-600" placeholder="Player_123">
                </div>
                
                <button id="create-room-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3.5 rounded-xl shadow-[0_0_15px_rgba(37,99,235,0.4)] transition-all active:scale-[0.98]">
                    Create Room
                </button>
            </div>

            <!-- Divider -->
            <div class="w-full flex items-center gap-4 py-2">
                <div class="h-px bg-slate-700 flex-1"></div>
                <span class="text-slate-500 text-sm font-medium">OR</span>
                <div class="h-px bg-slate-700 flex-1"></div>
            </div>

            <!-- Join Room Section -->
            <div class="w-full bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700 flex flex-col gap-4 relative overflow-hidden">
                <div class="absolute -bottom-10 -left-10 w-24 h-24 bg-green-500/10 rounded-full blur-xl"></div>
                
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-1">Room Code</label>
                    <input type="text" id="room-code-input" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-3 text-white font-mono uppercase tracking-widest focus:outline-none focus:ring-2 focus:ring-green-500 transition-all placeholder:text-slate-600" placeholder="e.g. A1B2" maxlength="4">
                </div>
                
                <button id="join-room-btn" class="w-full bg-green-600 hover:bg-green-500 text-white font-semibold py-3.5 rounded-xl shadow-[0_0_15px_rgba(22,163,74,0.4)] transition-all active:scale-[0.98]">
                    Join Room
                </button>
            </div>
        </div>

        <!-- =================== -->
        <!--  Waiting Room View  -->
        <!-- =================== -->
        <div id="waiting-room-view" class="w-full hidden flex-col items-center gap-6">
            <h1 class="text-3xl font-bold text-yellow-400 tracking-wider">🐉 Waiting Room</h1>
            
            <!-- Room Info Card -->
            <div class="w-full bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700 text-center relative overflow-hidden">
                <div class="absolute -top-10 -right-10 w-32 h-32 bg-yellow-500/5 rounded-full blur-2xl"></div>
                
                <p class="text-slate-400 font-medium mb-1">Room Code</p>
                <div class="text-6xl font-mono font-bold tracking-widest text-white mb-6 drop-shadow-md" id="display-room-code">----</div>
                
                <div class="text-left">
                    <p class="text-xs text-slate-400 mb-3 uppercase tracking-widest font-bold border-b border-slate-700 pb-2">Players (<span id="player-count">0</span>)</p>
                    <ul id="player-list" class="flex flex-col gap-2 max-h-[40vh] overflow-y-auto pr-1">
                        <!-- Player items injected via JS -->
                    </ul>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="w-full flex gap-4">
                <button id="add-bot-btn" class="flex-1 hidden bg-purple-600 hover:bg-purple-500 text-white font-bold py-4 rounded-xl shadow-[0_0_20px_rgba(147,51,234,0.5)] transition-all active:scale-[0.98] text-lg uppercase tracking-wide">
                    Add Bot 🤖
                </button>
                <button id="start-game-btn" class="flex-1 hidden bg-red-600 hover:bg-red-500 text-white font-bold py-4 rounded-xl shadow-[0_0_20px_rgba(220,38,38,0.5)] transition-all active:scale-[0.98] text-lg uppercase tracking-wide">
                    Start Game
                </button>
            </div>
        </div>

    <!-- End Waiting Room View -->
        <!-- =================== -->
        <!--     Game View       -->
        <!-- =================== -->
        <div id="game-view" class="w-full hidden flex-col items-center gap-4">
            
            <!-- Game Header -->
            <div class="w-full flex flex-col gap-2 bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-md">
                <div class="w-full flex justify-between items-center">
                    <div class="text-slate-300 font-semibold">Pot: <span id="game-pot" class="text-yellow-400 font-mono text-xl">$0</span></div>
                    <div class="text-slate-300 font-semibold">Chips: <span id="game-chips" class="text-green-400 font-mono text-xl">$0</span></div>
                </div>
                <!-- Players Balance Container -->
                <div id="players-balance-container" class="w-full flex gap-2 overflow-x-auto py-1 scrollbar-hide">
                    <!-- Badges injected here -->
                </div>
                <!-- Top Action Row -->
                <div class="w-full flex justify-between gap-2 mt-1">
                    <button id="leave-game-btn" class="bg-slate-700 hover:bg-slate-600 text-white text-xs font-bold py-1.5 px-3 rounded-lg shadow transition-all">Leave Game</button>
                    <button id="end-game-btn" class="bg-red-900/50 hover:bg-red-800 text-red-200 text-xs font-bold py-1.5 px-3 rounded-lg shadow transition-all hidden">End Game</button>
                </div>
            </div>

            <!-- Turn Indicator -->
            <div id="turn-indicator" class="w-full text-center py-2 text-lg font-bold tracking-wide rounded-lg bg-blue-900/30 text-blue-300 border border-blue-500/30">
                Waiting for game to start...
            </div>

            <!-- Cards Area -->
            <div class="w-full flex justify-center items-center gap-4 my-4 perspective-1000">
                <!-- Card 1 -->
                <div class="card-slot w-20 h-32 perspective-1000" id="card1-slot">
                    <div class="card-inner relative w-full h-full transition-transform duration-500 transform-style-3d">
                        <div class="card-front absolute w-full h-full backface-hidden bg-white text-slate-800 flex items-center justify-center text-3xl font-bold rounded-xl border-2 border-slate-300 shadow-2xl rotate-y-180" id="card-1">?</div>
                        <div class="card-back absolute w-full h-full backface-hidden bg-slate-800 border-2 border-slate-600 rounded-xl"></div>
                    </div>
                </div>
                <!-- Card 3 -->
                <div class="card-slot w-20 h-32 perspective-1000 hidden" id="card3-slot">
                    <div class="card-inner relative w-full h-full transition-transform duration-500 transform-style-3d">
                        <div class="card-front absolute w-full h-full backface-hidden bg-white text-slate-800 flex items-center justify-center text-3xl font-bold rounded-xl border-2 border-slate-300 shadow-2xl rotate-y-180" id="card-3">?</div>
                        <div class="card-back absolute w-full h-full backface-hidden bg-slate-800 border-2 border-slate-600 rounded-xl"></div>
                    </div>
                </div>
                <!-- Card 2 -->
                <div class="card-slot w-20 h-32 perspective-1000" id="card2-slot">
                    <div class="card-inner relative w-full h-full transition-transform duration-500 transform-style-3d">
                        <div class="card-front absolute w-full h-full backface-hidden bg-white text-slate-800 flex items-center justify-center text-3xl font-bold rounded-xl border-2 border-slate-300 shadow-2xl rotate-y-180" id="card-2">?</div>
                        <div class="card-back absolute w-full h-full backface-hidden bg-slate-800 border-2 border-slate-600 rounded-xl"></div>
                    </div>
                </div>
            </div>

            <!-- Action Area -->
            <div class="w-full bg-slate-800 p-5 rounded-2xl shadow-xl border border-slate-700 flex flex-col gap-4">
                
                <!-- Rule Hint -->
                <div id="rule-hint" class="w-full text-center text-sm font-semibold text-yellow-400 hidden"></div>

                <!-- Normal & Middle Hole Bet Container -->
                <div id="normal-action-view" class="w-full flex flex-col gap-4 hidden">
                    <div class="flex items-center gap-3">
                        <span class="text-slate-400 font-medium">$</span>
                        <input type="number" id="bet-input" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-3 text-white font-mono focus:outline-none focus:ring-2 focus:ring-red-500 transition-all placeholder:text-slate-600" placeholder="Bet Amount" min="20">
                    </div>
                    <button id="bet-btn" class="w-full bg-red-600 hover:bg-red-500 disabled:opacity-50 disabled:cursor-not-allowed text-white font-bold py-4 rounded-xl shadow-[0_0_15px_rgba(220,38,38,0.4)] transition-all active:scale-[0.98] uppercase tracking-wider text-lg">
                        Bet & Draw
                    </button>
                </div>

                <!-- Pair Guess Container -->
                <div id="pair-action-view" class="w-full flex flex-col gap-4 hidden">
                    <div class="flex items-center gap-3">
                        <span class="text-slate-400 font-medium">$</span>
                        <input type="number" id="pair-bet-input" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-3 text-white font-mono focus:outline-none focus:ring-2 focus:ring-purple-500 transition-all placeholder:text-slate-600" placeholder="Bet Amount" min="20">
                    </div>
                    <div class="w-full flex gap-3">
                        <button id="bet-high-btn" class="flex-1 bg-purple-600 hover:bg-purple-500 disabled:opacity-50 disabled:cursor-not-allowed text-white font-bold py-3 rounded-xl shadow-[0_0_15px_rgba(147,51,234,0.4)] transition-all active:scale-[0.98] uppercase tracking-wider text-md">
                            High ⬆
                        </button>
                        <button id="bet-low-btn" class="flex-1 bg-teal-600 hover:bg-teal-500 disabled:opacity-50 disabled:cursor-not-allowed text-white font-bold py-3 rounded-xl shadow-[0_0_15px_rgba(20,184,166,0.4)] transition-all active:scale-[0.98] uppercase tracking-wider text-md">
                            Low ⬇
                        </button>
                    </div>
                </div>

                <!-- Consecutive Pass Container -->
                <div id="consecutive-action-view" class="w-full flex flex-col gap-4 hidden">
                    <button id="pass-btn" class="w-full bg-slate-600 hover:bg-slate-500 disabled:opacity-50 disabled:cursor-not-allowed text-white font-bold py-4 rounded-xl shadow-[0_0_15px_rgba(71,85,105,0.4)] transition-all active:scale-[0.98] uppercase tracking-wider text-lg">
                        Pass (0)
                    </button>
                </div>

                <!-- Shared Slider & Half-In Controls -->
                <div id="bet-controls-view" class="w-full flex-col gap-3 hidden">
                    <div class="w-full flex items-center gap-3">
                        <input type="range" id="bet-slider" min="20" step="10" class="flex-1 h-2 bg-slate-900 rounded-lg appearance-none cursor-pointer accent-blue-500 border border-slate-700">
                        <button id="half-in-btn" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold py-2.5 px-3 rounded-lg shadow-[0_0_10px_rgba(37,99,235,0.4)] whitespace-nowrap transition-all active:scale-[0.95]">
                            Half-In
                        </button>
                    </div>
                </div>

                <button id="bankrupt-btn" class="w-full hidden bg-yellow-500 hover:bg-yellow-400 text-slate-900 font-bold py-4 rounded-xl shadow-[0_0_15px_rgba(234,179,8,0.4)] transition-all active:scale-[0.98] uppercase tracking-wider text-lg">
                    Revive! Borrow $1000
                </button>
            </div>

            <!-- Log Area -->
            <div class="w-full bg-slate-900 p-3 rounded-xl border border-slate-700 h-32 overflow-y-auto flex flex-col gap-1 text-sm font-mono shadow-inner" id="game-log">
                <!-- Log entries injected here -->
            </div>

            <!-- Footer Stats -->
            <div class="w-full flex justify-between items-center text-xs text-slate-500 pt-2 border-t border-slate-800 px-1">
                <div>Room: <span id="footer-room" class="font-mono text-slate-400">----</span></div>
                <div><span id="footer-humans" class="text-slate-400">0</span> Humans | <span id="footer-bots" class="text-slate-400">0</span> Bots</div>
            </div>
        </div>
        
        <!-- =================== -->
        <!--  Game Over View     -->
        <!-- =================== -->
        <div id="game-over-view" class="w-full hidden flex-col items-center gap-6 z-50 absolute inset-0 bg-slate-900/95 p-6 backdrop-blur-sm">
            <h1 class="text-4xl font-bold text-yellow-400 mt-10 mb-4 tracking-wider drop-shadow-lg animate-bounce">🏆 Game Over!</h1>
            
            <div class="w-full bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 overflow-hidden flex flex-col max-h-[60vh] w-full max-w-full">
                <div class="bg-slate-700 py-3 px-2 sm:px-4 flex justify-between text-slate-300 text-[10px] sm:text-xs font-bold uppercase tracking-wider shadow-md z-10 gap-1 sm:gap-2">
                    <span class="w-6 sm:w-8 text-center">#</span>
                    <span class="flex-1 truncate">Player</span>
                    <span class="w-12 sm:w-16 text-right">Chips</span>
                    <span class="w-12 sm:w-16 text-right text-red-400">Debt</span>
                    <span class="w-12 sm:w-16 text-right text-green-400">Net</span>
                </div>
                <div id="ranking-list" class="flex flex-col overflow-y-auto text-xs sm:text-sm">
                    <!-- Injected via JS -->
                </div>
            </div>

            <button id="back-to-lobby-btn" class="w-full mt-auto mb-10 bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl shadow-[0_0_20px_rgba(37,99,235,0.5)] transition-all active:scale-[0.98] text-lg uppercase tracking-wide">
                Back to Lobby
            </button>
        </div>

    </div>
    
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(reg => {
                    console.log('Service Worker registered', reg);
                }).catch(err => {
                    console.error('Service Worker registration failed', err);
                });
            });
        }
    </script>
</body>
</html>
